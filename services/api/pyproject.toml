[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dogsense-api"
version = "0.1.0"
description = "FastAPI backend for DogSense Live"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "asyncpg>=0.29,<1",
  "cryptography>=41,<47",
]

[project.optional-dependencies]
external = ["snowflake-connector-python>=3.12,<5", "solders>=0.21,<1"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=5,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]
"app/security.py" = ["B008"]
"tests/**/*.py" = ["S105", "S106"]
